# SP25 实车入口 standard 的硬件与启动默认配置。
# 上车调试时优先看这个文件；除非显式开启，否则默认不允许发送开火。
hardware:
  camera:
    # backend: opencv=普通摄像头/视频文件 | hik=海康 MVS
    backend: "hik"
    camera_sn: ""                # 留空使用检测到的第一台工业相机；多相机时建议填序列号

    # source 为空时通过 OpenCV 打开 device_index；非空时可以是视频文件、
    # 流地址，或 OpenCV 后端支持的设备路径。
    source: ""
    device_index: 0
    width: 1280
    height: 1024
    fps: 120.0
    exposure_time_us: 5500.0      # 海康曝光时间，单位微秒
    gain: 16.0                    # 海康增益；OpenCV 后端仅在值大于 0 时尝试设置
    analog_gain: 8                # 保留旧字段，standard 当前不读取
    frame_speed: 1                # 保留旧字段，standard 当前不读取
    flip_image: true              # 旧实车海康配置为 true；画面倒置时调这个
    camera_info: "configs/camera_info.yaml"
    calibration_mode: "strict"   # strict=严格匹配 | scale=缩放内参 | center_crop=中心裁剪

    # 相机 optical 坐标系相对枪管坐标系的外参。xyz 单位米，rpy 单位弧度。
    camera_to_barrel:
      xyz: [0.100, 0.0075, 0.000]
      rpy: [0.0, 0.137, 0.0]

  serial:
    port: "/dev/ttyACM0"
    baudrate: 115200
    protocol: "infantry"          # 兼容旧配置；未设置 tx/rx_protocol 时收发共用这个协议
    tx_protocol: "infantry_32"    # 发给下位机：32字节，包含角加速度
    rx_protocol: "infantry"       # 下位机反馈：实测仍为24字节 infantry
    infantry32_tail_fields: "acceleration"  # 32字节尾部发送 pitch_acc/yaw_acc
    command_angles_in_degrees: false  # false=下发 rad、rad/s、rad/s²；true=下发角度制
    feedback_angles_in_degrees: false  # 当前下位机反馈仍按角度制解析，再转为内部弧度
    read_timeout_ms: 2
    feedback_timeout_ms: 100
    require_feedback: true

  detector:
    enemy_color: "red"           # red=红方 | blue=蓝方

  controller:
    bullet_speed: 23.0
    strategy: ""                 # 保留旧字段，standard 当前不读取

  safety:
    dry_run: false               # true 表示不打开串口、不发送串口数据
    enable_fire: false           # false 会在串口发送前强制关闭开火建议
