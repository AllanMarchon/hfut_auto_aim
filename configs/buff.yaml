# 26 赛季打符配置：日常调参项放前面，固定实现参数使用代码默认值。
# standard 启动时从 hardware.yaml 同步相机内参、畸变和相机到枪管外参。

# 检测器
detector_backend: szu                 # szu=深大 26 五点模型；sp25=备用 baseline
szu_model: assets/szu_rune_model_0624.onnx
model: assets/yolo11_buff_int8.xml    # 仅 detector_backend=sp25 时使用
device: GPU
szu_preprocess_mode: letterbox        # letterbox=等比例缩放；center_crop=中心裁剪
szu_confidence: 0.8                   # 网络目标置信度阈值
szu_keypoint_confidence: 0.8          # 网络关键点置信度阈值
confidence: 0.7                      # 仅 SP25 backend 使用
iou_threshold: 0.4                   # 仅 SP25 backend 使用
szu_traditional_refine: true          # 网络四角的传统局部精修
szu_traditional_r_refine: true        # 精修可视 R 中心，仅影响 R 点观测/诊断
szu_r_red_minus_blue_threshold: 50.0  # 红方 R 颜色差分阈值；增大可排除较弱红色反光
szu_r_blue_minus_red_threshold: 62.0  # 蓝方 R 颜色差分阈值；增大可排除较弱蓝色反光
szu_rp26_refine: false                # 关闭 RP26 轮廓锚点分支
szu_use_rp26_pose: false              # 固定用网络四角几何解算姿态
szu_use_r_in_pnp: false                # R 点不参与 PnP 拟合或镜像分支选择
szu_r_object_normal_offset_m: -0.1     # R 点重投影诊断模型的法向偏移，单位米
szu_target_class_id: 0                 # 当前待击打叶片类别
szu_debug_log: false                   # 排查检测问题时临时开启

# 姿态连续性保护：一般不需要调
szu_corner_reprojection_max_px: 15.0
szu_pose_max_jump_deg: 15.0
szu_pose_max_translation_jump_m: 0.35
szu_pose_reacquire_after_rejections: 20

# 瞄准与控制
smallbuff_static_model: true           # true=静止模型；false=默认旋转模型
yaw_offset: 0.0                        # 度
pitch_offset: 0.0                      # 度
fire_gap_time: 0.700                   # 同一扇叶连续开火间隔，秒
predict_time: 0.120                    # 打符预测提前量，秒

# controller.yaml 使用 MPC 时生效；静止模型跟踪固定点，旋转模型跟踪小符预测轨迹。
# 加速度单位 rad/s^2；速度单位 deg/s；误差增益单位 1/s。
smallbuff_mpc:
  max_yaw_acceleration: 10.0
  max_pitch_acceleration: 15.0
  yaw_error_gain: 2.0
  pitch_error_gain: 2.0
  max_yaw_velocity: 80.0
  max_pitch_velocity: 60.0

# 标定：相机内参/畸变和相机到枪管外参由 hardware.yaml 覆盖。
# R_gimbal2imubody 仍从本文件读取；其余数值是独立运行时的回退值。
image_width: 1280
image_height: 1024
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
camera_matrix: [1762.22864, 0.0, 513.82984, 0.0, 1763.58882, 478.72438, 0.0, 0.0, 1.0]
distort_coeffs: [-0.069163, 0.078039, 0.001264, -0.000786, 0.0]
R_camera2gimbal: [0, -0.136571843168, 0.99063016896, -1, 0, 0, 0, -0.99063016896, -0.136571843168]
t_camera2gimbal: [0.100, 0.0075, 0.000]
