# 26 赛季打符配置。
# standard 启动时会把 hardware.yaml 中的相机内参和相机到枪管外参同步到 build/sp25_runtime.yaml。

#####-----buff_detector 参数-----#####
# detector_backend: szu / sp25
# szu：深大 26 能量机关五点模型，默认推荐；sp25：SP25 原版打符模型，保留为备用 baseline。
detector_backend: szu

# SP25 原版打符模型。仅 detector_backend=sp25 时使用。
model: assets/yolo11_buff_int8.xml

# SZU 26 能量机关五点模型。输出类别：0=待击打叶片，1=小符已击中叶片，2=大符已击中叶片。
szu_model: assets/szu_rune_model_0624.onnx
device: GPU
# 只影响 SZU 打符内部预处理；普通自瞄仍使用原始相机图像。实车使用保持比例的信箱变换。
szu_preprocess_mode: letterbox
confidence: 0.7
iou_threshold: 0.4
# 类别和关键点阈值沿用模型 README 默认值；传统阶段只负责局部几何修正。
szu_confidence: 0.8
szu_keypoint_confidence: 0.8
szu_nms_distance: 30.0
# 传统阶段的候选入口只要求至少 3 个网络点有效，传统精修失败时保留网络点。
szu_traditional_min_valid_keypoints: 3
# 关闭传统阶段时使用的严格备用门槛。
szu_min_valid_keypoints: 4
# 低置信角点才沿模型 R 点到符叶的径向搜索亮暗边界，再用结构张量做备用亚像素精修；高置信角点保留网络原点。
szu_traditional_refine: true
# 用网络 R 作为种子，在受限敌方颜色轮廓中拟合真实 R 中心；失败时保留网络点。
szu_traditional_r_refine: true
# 小符未激活叶片使用 RP26 语义轮廓锚点；该轮廓参数是本工程配置，不代表公开仓库中的官方调参值。
szu_rp26_refine: true
szu_rp26_strict: false
szu_rp26_roi_scale: 1.4
# 当前轮廓分类阈值。
szu_rp26_armor_area_relative_error: 0.35
szu_rp26_armor_solidity_threshold: 0.80
szu_rp26_light_solidity_threshold: 0.66
szu_rp26_red_minus_blue_threshold: 60.0
szu_rp26_blue_minus_red_threshold: 62.0
szu_rp26_line_samples: 30
szu_traditional_corner_window: 5
szu_traditional_max_shift_px: 8.0
# R 轮廓细化的最大允许偏移；该值只影响 R 观测，不参与四角 PnP 距离。
szu_traditional_r_max_shift_px: 24.0
szu_r_color_roi_scale: 1.4
szu_r_red_minus_blue_threshold: 50.0
szu_r_blue_minus_red_threshold: 62.0
szu_r_color_kernel_size: 5
# R 点集合的最大离群距离和目标叶片到 R 点的最小像素距离。
szu_r_center_max_spread_px: 50.0
szu_min_target_radius_px: 20.0
# 默认只记录 R 点几何异常，不用经验阈值直接丢弃整帧。
szu_reject_r_geometry: false
# SZU R/五点 PnP 的宽松保护阈值；R 误差可有建模偏差，但超过此值不再用于镜像分支判别。
szu_corner_reprojection_max_px: 15.0
szu_r_reprojection_max_px: 50.0
# R 点允许的额外误差余量，仅在显式重新开启 R 约束时用于五点候选筛选。
szu_r_reprojection_margin_px: 20.0
# 有效跟踪帧比较世界坐标下的符盘法向和相对云台原点的 R 中心向量；短时重获也必须通过同一门限。
# 随机换扇叶只改变盘面内位置，符盘法向和中心不会在相邻帧跳变；较紧门限用于拦住 IPPE 镜像解。
# R 中心向量没有底盘平移补偿，底盘移动时只适合作为短时连续性参考。
szu_pose_max_jump_deg: 15.0
szu_pose_max_translation_jump_m: 0.35
# 连续重获失败时只限制拒绝计数，不清除旧法向先验，避免长时间丢帧后冷启动到镜像距离分支。
szu_pose_reacquire_after_rejections: 20
# R 不参与小符 RP26 姿态拟合；关闭 RP26 时保留旧 SZU 四点兼容路径。
szu_use_r_in_pnp: false
# 启用后小符优先使用 RP26 语义锚点；轮廓精修失败时回退网络四角，大符仍使用原 SZU 四点路径。
szu_use_rp26_pose: true
# R 标相对符盘旋转中心的法向偏移，单位米。R 标应比旋转中心更靠近相机；当前模型约定为负方向。
# 只改这个值用于对照实验，不要把扫描日志中的瞬时最佳值直接当作最终标定值。
szu_r_object_normal_offset_m: -0.1

# SZU 五点编号：0 是远离 R 的外端，1 在 0 的逆时针侧，3 在顺时针侧，4 是朝 R 的内端，2 是 R 标中心。
# 传统阶段关闭时强制四个符叶角点过关键点阈值；开启时允许三个网络点进入，由传统阶段尝试修正。
# R 点参与中心估计，但不要求 5/5 全部过阈值。
# 只选择四个叶片角点并保留模型原始编号；几何与 PnP 按顺时针 [0, 3, 4, 1] 恢复。
szu_corner_indices: [0, 1, 3, 4]
szu_r_center_index: 2
szu_required_keypoint_indices: [0, 1, 3, 4]

# 排查 detections=0 时打开；会周期性打印模型置信度、关键点过滤、NMS 和目标分类数量。
szu_debug_log: false
szu_debug_log_every_n: 60

# 26 规则下，当前“待击打叶片”是 class 0；大小符默认都以 class 0 作为可打目标。
szu_target_class_id: 0
szu_small_target_class_id: 0
szu_big_target_class_id: 0

#####-----buff_aimer 参数-----#####
# 单位：度。正负方向沿用 SP25 打符 Aimer，实车调参时只微调小量。
yaw_offset: 0.0
pitch_offset: 0.0

# 同一扇叶连续开火间隔，单位秒。
fire_gap_time: 0.700

# 打符预测提前量，单位秒。第一版保留 SP25 默认值。
predict_time: 0.120

# 打符角度运动前馈；使用预测瞄准角的中心差分生成角速度和角加速度。
motion_feedforward:
  enable: true
  difference_time: 0.120  # s；差分间隔受当前预测时域限制
  max_yaw_velocity: 120.0  # deg/s；打符专用上限
  max_pitch_velocity: 90.0  # deg/s；打符专用上限
  max_yaw_acceleration: 50.0  # rad/s^2；打符专用上限
  max_pitch_acceleration: 80.0  # rad/s^2；打符专用上限

# 小符 TinyMPC 专用控制参数。只在 smallbuff 模式覆盖 controller.yaml，
# 普通自瞄和大符不受影响。7m 左右先用较保守的云台能力，换叶片时会更平顺。
# max_*_acceleration 同时限制 MPC 输入和最终下发加速度，单位 rad/s^2。
# *_error_gain 单位 1/s；速度上限单位 deg/s，同时作为换亮扇叶时的角度渐入上限。
smallbuff_mpc:
  max_yaw_acceleration: 10.0
  max_pitch_acceleration: 15.0
  yaw_error_gain: 2.0
  pitch_error_gain: 2.0
  max_yaw_velocity: 80.0
  max_pitch_velocity: 60.0

#####-----启动时会被 hardware.yaml 覆盖的实车标定参数-----#####
image_width: 1280
image_height: 1024
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
camera_matrix: [1762.22864, 0.0, 513.82984, 0.0, 1763.58882, 478.72438, 0.0, 0.0, 1.0]
distort_coeffs: [-0.069163, 0.078039, 0.001264, -0.000786, 0.0]
R_camera2gimbal: [0, -0.136571843168, 0.99063016896, -1, 0, 0, 0, -0.99063016896, -0.136571843168]
t_camera2gimbal: [0.100, 0.0075, 0.000]
