# 26 赛季打符配置：日常调参项放前面，固定实现参数使用代码默认值。
# standard 启动时从 hardware.yaml 同步相机内参、畸变和相机到枪管外参。

# 打符后端。standard 对 smallbuff/bigbuff 默认启用。
buff:
  enabled: true
  planner_mode: njust
  model:
    type: njust
    njust:
      prediction_method: weighted_least_squares
      motion_fit:
        small:
          window_seconds: 2.0
          min_fit_seconds: 0.5
          weight_half_life_seconds: 2.0
        big:
          window_seconds: 6.0
          min_fit_seconds: 1.5
          weight_half_life_seconds: 3.0
  aimer:
    type: njust
    ballistic:
      type: vacuum
    njust:
      shoot_delay: 0.04          # 发射延迟，单位秒
      rune_idle_duration: 0.4    # 符叶周期的等待时间，单位秒
      rune_shoot_duration: 0.2   # 符叶周期的开火时间，单位秒
      yaw_tolerance: 0.11        # 符叶横向容差，单位米
      pitch_tolerance: 0.11      # 符叶纵向容差，单位米
  detector:
    type: climber
    climber:
      model: assets/buff_repvgg.xml
      device: GPU
      max_bullseyes: 2
      ConfidenceThreshold: 0.2
      IouThreshold: 0.2
      binary_threshold: 100
      dilate_kernel_size: 5
      dilate_iterations: 1
      r_center_mask_ratio: 0.8
      r_center_contour_div: 3.0
      r_center_refine_max_shift: 5.0
      dedup_distance: 18.0

  # 打符专用云台控制参数，不读取普通自瞄 controller.yaml 的对应数值。
  # 加速度单位 rad/s^2；速度单位 deg/s；误差增益单位 1/s。
  control:
    smallbuff:
      max_yaw_acceleration: 100.0
      max_pitch_acceleration: 100.0
      yaw_error_gain: 4.0
      pitch_error_gain: 4.0
      max_yaw_velocity: 80.0
      max_pitch_velocity: 60.0
    bigbuff:
      max_yaw_acceleration: 80.0
      max_pitch_acceleration: 100.0
      yaw_error_gain: 4.0
      pitch_error_gain: 4.0
      max_yaw_velocity: 120.0
      max_pitch_velocity: 90.0
    angle_limit:
      max_yaw_diff: 15.0
      max_pitch_diff: 10.0
    rate_limit:
      max_yaw_step_deg: 1.5
      max_pitch_step_deg: 1.0
    fire_gate:
      enable: true
      yaw_tolerance: 3.0
      pitch_tolerance: 2.0

# 瞄准偏置，单位：度。yaw/pitch 正方向按当前云台坐标约定。
yaw_offset: -8.4
pitch_offset: -2.0

# 标定：相机内参/畸变和相机到枪管外参由 hardware.yaml 覆盖。
# R_gimbal2imubody 仍从本文件读取；其余数值是独立运行时的回退值。
image_width: 1280
image_height: 1024
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
camera_matrix: [1762.22864, 0.0, 513.82984, 0.0, 1763.58882, 478.72438, 0.0, 0.0, 1.0]
distort_coeffs: [-0.069163, 0.078039, 0.001264, -0.000786, 0.0]
R_camera2gimbal: [0, -0.136571843168, 0.99063016896, -1, 0, 0, 0, -0.99063016896, -0.136571843168]
t_camera2gimbal: [0.100, 0.0075, 0.000]
