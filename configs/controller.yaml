# SP25 实车入口 standard 的普通自瞄控制输出配置。
#
# 这个文件保留旧工程 controller.yaml 的存放习惯。standard 默认使用
# SP TinyMPC 二阶轨迹规划；必要时可通过 planner.mode 切回已跑通的
# Aimer + 轻量保护链路。smallbuff/bigbuff 使用 configs/buff.yaml 的
# buff.control，不读取本文件中的普通自瞄控制数值。
# 串口打包格式仍由 hardware.yaml 的 serial 段决定。
gimbal_pipeline:
  ros__parameters:
    controller:
      # 输出规划器开关：
      #   mpc                  = 默认 SP TinyMPC 二阶规划；速度仍按 serial_command.velocity_mode 适配电控语义。
      #   aimer_feedback_error = 备用已跑通链路：Aimer 输出角度 + 反馈误差速度适配。
      planner:
        mode: mpc

      # SP TinyMPC 参数，仅普通自瞄使用。
      # yaw_offset / pitch_offset 单位：度；max_*_acc 单位：rad/s²。
      # MPC 模式下 max_*_acc 同时作为 TinyMPC 内部约束和最终串口下发云台加速度限幅。
      # fire_thresh 只决定 MPC 是否提出开火候选；最终串口开火位还必须通过下方反馈角门控。
      mpc_planner:
        yaw_offset: 1.2
        pitch_offset: 2.5
        fire_thresh: 0.0035
        coming_angle: 55.0              # 普通 MPC 允许装甲板进入的角度范围，单位度
        leaving_angle: 20.0             # 按旋转方向允许装甲板离开的角度，单位度
        # 兼容旧两档延迟的速度阈值；普通旋转目标优先使用下面的标定表。
        decision_speed: 6.0
        # 旧两档额外补偿，单位秒；普通目标配置标定表后使用表内 extra_prediction_s。
        # 前哨站继续使用此处的高低速补偿，并与电控反馈的发弹延迟相加。
        high_speed_delay_time: 0.00
        low_speed_delay_time: 0.0

        # 普通旋转目标（不含前哨站）的转速标定表，按 |目标角速度| 查表并线性插值。
        # extra_prediction_s 是额外预测时间；aligned_hold_ms 是反馈角持续对齐时间。
        # 0ms 预测补偿表示不增加额外时间；0ms 对齐保持表示沿用下方 fire_gate 的连续帧门槛。
        # 请用实测结果逐档标定；前哨站继续使用现有固定转速和独立配置。
        ordinary_spin_profile:
          - speed_rad_s: 0.0
            extra_prediction_s: 0.0
            aligned_hold_ms: 0.0
          - speed_rad_s: 3.0
            extra_prediction_s: 0.0
            aligned_hold_ms: 0.0
          - speed_rad_s: 6.0
            extra_prediction_s: 0.0
            aligned_hold_ms: 0.0
          - speed_rad_s: 9.0
            extra_prediction_s: 0.0
            aligned_hold_ms: 0.0
          - speed_rad_s: 12.0
            extra_prediction_s: 0.0
            aligned_hold_ms: 0.0
          - speed_rad_s: 15.0
            extra_prediction_s: 0.0
            aligned_hold_ms: 0.0

        # 高速反小陀螺首版参数，仅普通目标使用，前哨站不进入该模式。
        # decision_speed 仍是进入高速模式的速度阈值，以下参数只控制模式切换和守位开火。
        anti_spin:
          enable: true
          enter_frames: 3                 # 达到 decision_speed 连续多少帧后进入高速模式
          exit_frames: 5                  # 低于退出阈值连续多少帧后退出高速模式
          exit_hysteresis_rad_s: 1.0      # 退出阈值 = decision_speed - 该值
          guard_stable_time_ms: 5.0       # 高速模式只要求短暂守位确认，避免错过装甲板通过窗口
          front_face_tolerance_deg: 15.0  # 稍微放宽正面相位窗口，仍需通过装甲板几何命中检查
          fire_yaw_tolerance_deg: 3.0     # 仅高速反小陀螺放宽反馈 yaw 门限；普通模式仍为 2 度
          fire_pitch_tolerance_deg: 2.5   # 仅高速反小陀螺放宽反馈 pitch 门限；普通模式仍为 2 度
        
        max_yaw_acc: 100.0
        Q_yaw: [9000000.0, 0.0]
        R_yaw: [1.0]
        max_pitch_acc: 100.0
        Q_pitch: [9000000.0, 0.0]
        R_pitch: [1.0]

      # 前哨站专用 MPC 覆盖项。不写的字段继承 mpc_planner。
      # 26 赛季前哨站三块板存在 102mm 高度差，pitch 切板响应通常需要单独调。
      outpost_mpc_planner:
        enable: true
        fire_thresh: 0.0035
        max_yaw_acc: 100.0
        max_pitch_acc: 140.0
        Q_pitch: [12000000.0, 0.0]
        R_pitch: [0.8]
        low_speed_delay_time: 0.01

      # 备用 Aimer 链路的云台能力上限。planner.mode: mpc 时最终下发限幅使用 mpc_planner.max_*_acc。
      # 单位：rad/s²。
      aim_planner:
        enable: true
        max_yaw_acc: 80.0
        max_pitch_acc: 80.0

      # 保留旧 output_filter 的常调字段。
      # max_yaw_diff / max_pitch_diff 单位：度，表示相对当前反馈角的最大单帧目标偏差。
      # max_yaw_rate / max_pitch_rate 沿用旧语义：度/帧。
      # 这里只限制最终 cmd 每帧能从上一帧变化多少，不再积累速度/加速度状态。
      output_filter:
        enable_clamping: true
        max_yaw_diff: 15.0
        max_pitch_diff: 10.0
        enable_rate_limiter: true
        max_yaw_rate: 1.5
        max_pitch_rate: 1.0
        one_euro_freq: 250.0

      # SP25 实车入口的轻量输出保护开关。
      # reset_timeout_s 超时后清空历史，重新接受 SP25 当前输出。
      command_limiter:
        enable: true
        reset_timeout_s: 0.25
        # max_yaw_step_rad: 0.02618
        # max_pitch_step_rad: 0.01745
        # max_yaw_acc_rad_s2: 80.0
        # max_pitch_acc_rad_s2: 80.0

      # 参考 SP25 原版：图像帧按自己的时间戳取对应时刻的云台反馈，
      # 不再把串口最新反馈直接套到刚采到的图像上。standard 当前没有海康
      # 硬件时间戳，先用 capture_end - timestamp_offset_ms 近似图像时刻。
      feedback_alignment:
        enable: true
        timestamp_offset_ms: 1.0  # SP25 原版近似使用 imu_at(t - 1ms)
        max_sample_age_ms: 50.0   # 历史里找不到足够近的反馈时退回 latest fb
        history_size: 1000        # 保存最近反馈样本，用于按图像时间插值

      # 串口下发字段开关。默认保持与电控约定一致，仍发送速度和加速度。
      # 上车排查抖动时可临时关掉某一项，让 32 字节包格式不变但对应字段发 0。
      # velocity_mode:
      #   target_rate    = SP25 原语义，只发目标角自身变化速度 d(cmd)/dt。
      #   feedback_error = 适配当前下位机，发送 d(cmd)/dt + K*(cmd-fb)，让静止目标也继续闭合残差。
      serial_command:
        send_velocity: true
        send_acceleration: true
        velocity_mode: feedback_error
        yaw_error_gain: 6.0     # 1/s；yaw_v += gain * (cmd_yaw - fb_yaw)
        pitch_error_gain: 6.0   # 1/s；pitch_v += gain * (cmd_pitch - fb_pitch)
        max_yaw_velocity: 120.0   # deg/s；限制最终下发 yaw_v
        max_pitch_velocity: 90.0  # deg/s；限制最终下发 pitch_v

      # SP25 raw 输出外点保护：挡近距离 PnP/整车模型/短暂扰动造成的 raw yaw 瞬跳。
      # 注意：这里只 hold/限单帧变化，不再生成一条新的二阶控制轨迹。
      target_stabilizer:
        enable: true
        max_yaw_jump: 4.0      # deg；单次 raw yaw 超过该变化视为外点，先 hold 上一帧
        max_yaw_rate: 120.0    # deg/s；额外按真实 dt 限制 cmd 单帧变化
        hold_frames: 3         # 跳变后连续几帧禁止开火建议
        freeze_on_unstable_state: true  # detecting/temp_lost 时先保持上一帧目标 yaw
        lost_target_hold_s: 0.25  # s；短暂丢目标时继续保持上一帧稳定瞄准角，避免视野被拉走

      # 开火门控：yaw/pitch 门限比较当前反馈角与 MPC 预测的命中瞄准角。
      # 普通旋转目标在标定表 aligned_hold_ms > 0 时改用持续对齐时间；为 0 时使用下方帧数。
      # 不满足时，本帧最终串口开火位立即为 0。
      fire_gate:
        enable: true
        require_tracking: true
        min_aligned_frames: 2
        yaw_tolerance: 2.0
        pitch_tolerance: 2.0

      # 前哨站专用最终开火门控。不写的字段继承 fire_gate。
      # 容差单位为度，分别控制 yaw/pitch 对预测命中瞄准角的严格程度。
      outpost_fire_gate:
        enable: true
        require_tracking: true
        min_aligned_frames: 5
        yaw_tolerance: 0.5
        pitch_tolerance: 0.5

      # SP25 与旧电控的坐标适配。这里不改变串口反馈显示和 cmd-fb 误差，只改变
      # SP25 输出到旧电控、以及旧电控反馈到 SP25 世界坐标补偿的边界符号。
      output_adapter:
        # SP25 内部约定 pitch“向上为负”，旧电控绝对角度约定 pitch“向上为正”。
        # 因此这里默认把 SP25 算出的 pitch 取反后再进入限幅器和串口下发。
        sp_pitch_to_command_sign: -1.0

        # 旧电控 yaw 与 SP25 world yaw 的边界符号。它同时用于：
        # 1) 旧电控反馈 yaw 进入 SP25 的 R_gimbal2world；
        # 2) SP25 算出的 world yaw 转回旧电控串口命令 yaw。
        # 若目标静止、云台 yaw 转动时 sp_yaw 跟随 fb_yaw 反向或大幅跳变，优先试 -1.0。
        feedback_yaw_to_world_sign: 1.0
